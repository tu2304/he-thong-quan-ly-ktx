<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phản ánh — Hệ thống quản lý KTX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
</head>
<body>
  <div id="toastContainer"></div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-ktx mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard.html"><span class="brand-icon"><i class="bi bi-building"></i></span>Hệ thống quản lý KTX</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <div class="navbar-nav flex-row gap-2">
        <a class="nav-link" href="/dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
        <a class="nav-link" href="/sinhvien.html"><i class="bi bi-people"></i>Sinh viên</a>
        <a class="nav-link" href="/phong.html"><i class="bi bi-door-open"></i>Phòng</a>
        <a class="nav-link active" href="/phananh.html"><i class="bi bi-chat-square-text"></i>Phản ánh</a>
        <a class="nav-link" href="/phi.html"><i class="bi bi-cash-stack"></i>Thu tiền</a>
        <a class="nav-link" href="/chatbot.html"><i class="bi bi-robot"></i>Hỏi đáp AI</a>
      </div>
        <div class="ms-lg-auto text-white d-flex align-items-center gap-2">
        <span id="userInfo" class="small"></span>
        <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Đăng xuất</button>
      </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="page-heading mb-0">
        <span class="page-icon"><i class="bi bi-chat-square-text"></i></span>
        <h4 class="mb-0">Phản ánh / Kiến nghị</h4>
      </div>
      <button class="btn btn-primary" id="btnAdd" data-bs-toggle="modal" data-bs-target="#paModal" style="display:none;">
        <i class="bi bi-plus-lg me-1"></i>Gửi phản ánh
      </button>
    </div>

    <div class="filter-bar row g-2 align-items-end">
      <div class="col-md-4">
        <label class="form-label small mb-1">Tìm theo nội dung</label>
        <input type="text" class="form-control" id="fKeyword" placeholder="Từ khóa trong nội dung...">
      </div>
      <div class="col-md-3">
        <label class="form-label small mb-1">Nhóm vấn đề</label>
        <input type="text" class="form-control" id="fNhomVanDe" placeholder="VD: Điện, Nước, Vệ sinh...">
      </div>
      <div class="col-md-3">
        <label class="form-label small mb-1">Trạng thái</label>
        <select class="form-select" id="fTrangThai">
          <option value="">Tất cả</option>
          <option value="Moi">Mới</option>
          <option value="DangXuLy">Đang xử lý</option>
          <option value="DaXuLy">Đã xử lý</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-outline-secondary w-100" id="btnSearch"><i class="bi bi-search me-1"></i>Lọc / Tìm</button>
      </div>
    </div>

    <div class="table-card">
      <table class="table table-ktx mb-0">
        <thead>
          <tr id="tableHeader">
            <th>Ngày tạo</th><th class="col-sv">Sinh viên</th><th>Phòng</th><th>Nội dung</th><th>Nhóm vấn đề</th><th>Trạng thái</th><th></th>
          </tr>
        </thead>
        <tbody id="paTableBody"></tbody>
      </table>
    </div>
    <div id="pagination" class="d-flex justify-content-between align-items-center"></div>
  </div>

  <!-- Modal gửi phản ánh mới (sinh viên) -->
  <div class="modal fade" id="paModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Gửi phản ánh mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="paForm">
            <div class="mb-2">
              <label class="form-label">Nội dung phản ánh</label>
              <textarea class="form-control" id="paNoiDung" rows="4" required placeholder="Mô tả vấn đề bạn gặp phải..."></textarea>
            </div>
            <div id="paFormError" class="text-danger small"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" id="btnSendPa">Gửi</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal cập nhật trạng thái (quản lý) -->
  <div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Cập nhật xử lý phản ánh</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="statusPaId">
          <div class="mb-2">
            <label class="form-label">Trạng thái</label>
            <select class="form-select" id="statusTrangThai">
              <option value="Moi">Mới</option>
              <option value="DangXuLy">Đang xử lý</option>
              <option value="DaXuLy">Đã xử lý</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Nhóm vấn đề</label>
            <input type="text" class="form-control" id="statusNhomVanDe" placeholder="VD: Điện, Nước, Vệ sinh, An ninh...">
          </div>
          <div id="statusFormError" class="text-danger small"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" id="btnSaveStatus">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/phananh.js"></script>
</body>
</html>
