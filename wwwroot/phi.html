<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thu tiền — Hệ thống quản lý KTX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
</head>
<body>
  <div id="toastContainer"></div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-ktx mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard.html"><span class="brand-icon"><i class="bi bi-building"></i></span>Hệ thống quản lý KTX</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <div class="navbar-nav flex-row gap-2">
          <a class="nav-link" href="/dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a class="nav-link" href="/sinhvien.html"><i class="bi bi-people"></i>Sinh viên</a>
          <a class="nav-link" href="/phong.html"><i class="bi bi-door-open"></i>Phòng</a>
          <a class="nav-link" href="/phananh.html"><i class="bi bi-chat-square-text"></i>Phản ánh</a>
          <a class="nav-link active" href="/phi.html"><i class="bi bi-cash-stack"></i>Thu tiền</a>
          <a class="nav-link" href="/chatbot.html"><i class="bi bi-robot"></i>Hỏi đáp AI</a>
        </div>
        <div class="ms-lg-auto text-white d-flex align-items-center gap-2">
          <span id="userInfo" class="small"></span>
          <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Đăng xuất</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="page-heading mb-0">
        <span class="page-icon"><i class="bi bi-cash-stack"></i></span>
        <h4 class="mb-0" id="pageTitle">Quản lý thu tiền</h4>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" id="btnCreateInvoice"><i class="bi bi-receipt me-1"></i>Tạo hóa đơn</button>
        <button class="btn btn-outline-primary" id="btnRefresh"><i class="bi bi-arrow-clockwise me-1"></i>Làm mới</button>
      </div>
    </div>

    <div class="filter-bar row g-2 align-items-end mb-3">
      <div class="col-md-3">
        <label class="form-label small mb-1">Sinh viên</label>
        <input type="text" class="form-control" id="fKeyword" placeholder="Tên hoặc mã SV">
      </div>
      <div class="col-md-3">
        <label class="form-label small mb-1">Trạng thái</label>
        <select class="form-select" id="fTrangThai">
          <option value="">Tất cả</option>
          <option value="ChuaThu">Chưa thu</option>
          <option value="DaThu">Đã thu</option>
          <option value="QuaHan">Quá hạn</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small mb-1">Loại phí</label>
        <select class="form-select" id="fLoaiPhi">
          <option value="">Tất cả</option>
          <option value="PhiPhong">Phí phòng</option>
          <option value="PhiDichVu">Phí dịch vụ</option>
          <option value="PhiKhac">Phí khác</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-outline-secondary w-100" id="btnSearch"><i class="bi bi-search me-1"></i>Tìm kiếm</button>
      </div>
    </div>

    <div class="table-card">
      <table class="table table-ktx mb-0">
        <thead>
          <tr>
            <th>Sinh viên</th>
            <th>Phòng</th>
            <th>Loại phí</th>
            <th>Số tiền</th>
            <th>Hạn thanh toán</th>
            <th>Trạng thái</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="phiTableBody"></tbody>
      </table>
    </div>
    <div id="pagination" class="d-flex justify-content-between align-items-center"></div>
  </div>

  <div class="modal fade" id="invoiceModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Tạo hóa đơn tiền phòng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Sinh viên / hợp đồng đang ở</label>
            <select class="form-select" id="invoiceContract"></select>
          </div>
          <div class="mb-2">
            <label class="form-label">Loại phí</label>
            <select class="form-select" id="invoiceType">
              <option value="PhiPhong">Tiền phòng</option>
              <option value="PhiDichVu">Phí dịch vụ</option>
              <option value="PhiKhac">Khoản khác</option>
            </select>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">Số tiền (VNĐ)</label>
              <input type="number" class="form-control" id="invoiceAmount" min="1" step="1000" placeholder="1200000">
            </div>
            <div class="col-6">
              <label class="form-label">Hạn thanh toán</label>
              <input type="date" class="form-control" id="invoiceDueDate">
            </div>
          </div>
          <div id="invoiceFormError" class="text-danger small mt-2"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" id="btnSaveInvoice">Tạo hóa đơn</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/phi.js?v=20260923"></script>
</body>
</html>
