<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinh viên — Hệ thống quản lý KTX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
</head>
<body>
  <div id="toastContainer"></div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-ktx mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard.html"><span class="brand-icon"><i class="bi bi-building"></i></span>Hệ thống quản lý KTX</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <div class="navbar-nav flex-row gap-2">
        <a class="nav-link" href="/dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
        <a class="nav-link active" href="/sinhvien.html"><i class="bi bi-people"></i>Sinh viên</a>
        <a class="nav-link" href="/phong.html"><i class="bi bi-door-open"></i>Phòng</a>
        <a class="nav-link" href="/phananh.html"><i class="bi bi-chat-square-text"></i>Phản ánh</a>
        <a class="nav-link" href="/phi.html"><i class="bi bi-cash-stack"></i>Thu tiền</a>
        <a class="nav-link" href="/chatbot.html"><i class="bi bi-robot"></i>Hỏi đáp AI</a>
      </div>
        <div class="ms-lg-auto text-white d-flex align-items-center gap-2">
        <span id="userInfo" class="small"></span>
        <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Đăng xuất</button>
      </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="page-heading mb-0">
        <span class="page-icon"><i class="bi bi-people"></i></span>
        <h4 class="mb-0">Quản lý sinh viên</h4>
      </div>
      <button class="btn btn-primary" id="btnAdd" data-bs-toggle="modal" data-bs-target="#svModal">
        <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
      </button>
    </div>

    <div class="filter-bar row g-2 align-items-end">
      <div class="col-md-4">
        <label class="form-label small mb-1">Tìm kiếm (mã SV / họ tên)</label>
        <input type="text" class="form-control" id="fKeyword" placeholder="VD: SV001 hoặc An">
      </div>
      <div class="col-md-3">
        <label class="form-label small mb-1">Lớp</label>
        <input type="text" class="form-control" id="fLop" placeholder="VD: CNTT1">
      </div>
      <div class="col-md-3">
        <label class="form-label small mb-1">Sắp xếp theo</label>
        <select class="form-select" id="fSortBy">
          <option value="hoten">Họ tên</option>
          <option value="masv">Mã số sinh viên</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-outline-secondary w-100" id="btnSearch"><i class="bi bi-search me-1"></i>Lọc / Tìm</button>
      </div>
    </div>

    <div class="table-card">
      <table class="table table-ktx mb-0">
        <thead>
          <tr>
            <th>Mã SV</th><th>Họ tên</th><th>Giới tính</th><th>Lớp</th><th>SĐT</th><th>Phòng hiện tại</th><th></th>
          </tr>
        </thead>
        <tbody id="svTableBody"></tbody>
      </table>
    </div>
    <div id="pagination" class="d-flex justify-content-between align-items-center"></div>
  </div>

  <div class="modal fade" id="assignRoomModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Xếp sinh viên vào phòng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="assignSinhVienId" />
          <div class="mb-2">
            <label class="form-label">Sinh viên</label>
            <input type="text" class="form-control" id="assignSinhVienName" readonly>
          </div>
          <div class="mb-2">
            <label class="form-label">Chọn giường trống</label>
            <select class="form-select" id="assignGiuongSelect"></select>
          </div>
          <div id="assignRoomError" class="text-danger small"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" id="btnAssignRoom">Xếp phòng</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal thêm/sửa sinh viên -->
  <div class="modal fade" id="svModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="svModalTitle">Thêm sinh viên</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="svForm">
            <input type="hidden" id="svId">
            <div class="mb-2" id="groupCreateOnly">
              <label class="form-label">Email đăng nhập</label>
              <input type="email" class="form-control" id="svEmail" required>
            </div>
            <div class="mb-2" id="groupPasswordOnly">
              <label class="form-label">Mật khẩu</label>
              <input type="password" class="form-control" id="svMatKhau" minlength="6">
            </div>
            <div class="mb-2" id="groupMaSvOnly">
              <label class="form-label">Mã số sinh viên</label>
              <input type="text" class="form-control" id="svMaSv" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Họ tên</label>
              <input type="text" class="form-control" id="svHoTen" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Giới tính</label>
              <select class="form-select" id="svGioiTinh">
                <option value="Nam">Nam</option>
                <option value="Nu">Nữ</option>
                <option value="Khac">Khác</option>
              </select>
            </div>
            <div class="mb-2" id="groupNgaySinhOnly">
              <label class="form-label">Ngày sinh</label>
              <input type="date" class="form-control" id="svNgaySinh">
            </div>
            <div class="mb-2">
              <label class="form-label">Lớp</label>
              <input type="text" class="form-control" id="svLop">
            </div>
            <div class="mb-2">
              <label class="form-label">Số điện thoại</label>
              <input type="text" class="form-control" id="svSdt">
            </div>
            <div id="svFormError" class="text-danger small"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" id="btnSaveSv">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sinhvien.js?v=20260923"></script>
</body>
</html>
