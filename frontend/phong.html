<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phòng — Hệ thống quản lý KTX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
</head>
<body>
  <div id="toastContainer"></div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-ktx mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard.html"><span class="brand-icon"><i class="bi bi-building"></i></span>Hệ thống quản lý KTX</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <div class="navbar-nav flex-row gap-2">
        <a class="nav-link" href="/dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
        <a class="nav-link" href="/sinhvien.html"><i class="bi bi-people"></i>Sinh viên</a>
        <a class="nav-link active" href="/phong.html"><i class="bi bi-door-open"></i>Phòng</a>
        <a class="nav-link" href="/phananh.html"><i class="bi bi-chat-square-text"></i>Phản ánh</a>
        <a class="nav-link" href="/phi.html"><i class="bi bi-cash-stack"></i>Thu tiền</a>
        <a class="nav-link" href="/chatbot.html"><i class="bi bi-robot"></i>Hỏi đáp AI</a>
      </div>
        <div class="ms-lg-auto text-white d-flex align-items-center gap-2">
        <span id="userInfo" class="small"></span>
        <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Đăng xuất</button>
      </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="page-heading mb-0">
        <span class="page-icon"><i class="bi bi-door-open"></i></span>
        <h4 class="mb-0">Quản lý phòng ở</h4>
      </div>
      <button class="btn btn-primary" id="btnAdd" data-bs-toggle="modal" data-bs-target="#phongModal">
        <i class="bi bi-plus-lg me-1"></i>Thêm phòng
      </button>
    </div>

    <div class="filter-bar row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label small mb-1">Tìm theo số phòng</label>
        <input type="text" class="form-control" id="fKeyword" placeholder="VD: A101">
      </div>
      <div class="col-md-2">
        <label class="form-label small mb-1">Tòa nhà</label>
        <select class="form-select" id="fToa">
          <option value="">Tất cả</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small mb-1">Trạng thái</label>
        <select class="form-select" id="fTrangThai">
          <option value="">Tất cả</option>
          <option value="ConTrong">Còn trống</option>
          <option value="Day">Đầy</option>
          <option value="KhoaTam">Khóa tạm</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small mb-1">Sắp xếp theo</label>
        <select class="form-select" id="fSortBy">
          <option value="soPhong">Số phòng</option>
          <option value="succhua">Sức chứa</option>
          <option value="trangthai">Trạng thái</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-outline-secondary w-100" id="btnSearch"><i class="bi bi-search me-1"></i>Lọc / Tìm</button>
      </div>
    </div>

    <div class="table-card">
      <table class="table table-ktx mb-0">
        <thead>
          <tr>
            <th>Số phòng</th><th>Tòa</th><th>Tầng</th><th>Loại phòng</th><th>Sức chứa</th><th>Giường trống</th><th>Trạng thái</th><th></th>
          </tr>
        </thead>
        <tbody id="phongTableBody"></tbody>
      </table>
    </div>
    <div id="pagination" class="d-flex justify-content-between align-items-center"></div>
  </div>

  <!-- Modal thêm/sửa phòng -->
  <div class="modal fade" id="phongModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="phongModalTitle">Thêm phòng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="phongForm">
            <input type="hidden" id="phongId">
            <div class="row g-2" id="groupCreateOnly">
              <div class="col-6 mb-2">
                <label class="form-label">Tòa nhà</label>
                <select class="form-select" id="mToa"></select>
              </div>
              <div class="col-6 mb-2">
                <label class="form-label">Tầng</label>
                <select class="form-select" id="mTang"></select>
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label">Số phòng</label>
              <input type="text" class="form-control" id="mSoPhong" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Loại phòng</label>
              <input type="text" class="form-control" id="mLoaiPhong" placeholder="VD: 4 người, VIP...">
            </div>
            <div class="mb-2">
              <label class="form-label">Sức chứa (số giường tối đa)</label>
              <input type="number" class="form-control" id="mSucChua" min="1" max="20" required>
            </div>
            <div class="mb-2" id="groupTrangThaiOnly" style="display:none;">
              <label class="form-label">Trạng thái</label>
              <select class="form-select" id="mTrangThai">
                <option value="ConTrong">Còn trống</option>
                <option value="Day">Đầy</option>
                <option value="KhoaTam">Khóa tạm</option>
              </select>
            </div>
            <div id="phongFormError" class="text-danger small"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" id="btnSavePhong">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal xem giường trong phòng -->
  <div class="modal fade" id="giuongModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Danh sách giường — Phòng <span id="giuongPhongTen"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="giuongList" class="mb-3"></div>
          <div class="input-group">
            <input type="text" class="form-control" id="mSoGiuongMoi" placeholder="Số giường mới, VD: G3">
            <button class="btn btn-outline-primary" id="btnAddGiuong">+ Thêm giường</button>
          </div>
          <div id="giuongFormError" class="text-danger small mt-1"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal xếp sinh viên vào giường trống -->
  <div class="modal fade" id="assignBedModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Thêm sinh viên vào giường</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Phòng</label>
            <input type="text" class="form-control" id="assignBedName" readonly>
          </div>
          <div class="mb-2">
            <label class="form-label">Giường trống</label>
            <select class="form-select" id="assignRoomBedSelect">
              <option value="">-- Chọn giường trống --</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Sinh viên chưa có phòng</label>
            <select class="form-select" id="assignStudentSelect">
              <option value="">-- Chọn sinh viên --</option>
            </select>
          </div>
          <div id="assignBedError" class="text-danger small"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" id="btnAssignBed">Thêm vào giường</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/phong.js"></script>
</body>
</html>
